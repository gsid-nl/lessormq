; Pool config for the queue service. Replaces the base image's www.conf, which is
; tuned for general-purpose apps (pm = ondemand, max_children = 250).
;
; This service is a small-JSON API: ~6ms per request, ~30 rps per pod. `ondemand`
; forks a fresh child on every traffic ramp, which is the worst shape for a latency
; sensitive poll endpoint, and 250 children cannot fit the 1G pod memory limit
; anyway — a spike would OOMKill the pod instead of queueing.
;
; 16 warm children at 6ms/request covers ~2500 rps, two orders of magnitude above
; observed load, and bounds worst-case memory at roughly 16 x 40M.

[www]
; Ignored when the master runs as non-root (the deployment runs as uid 1000);
; kept so the image still starts if it is ever run as root.
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 16
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 8
pm.max_requests = 10000

; Surfaces per-request stalls in the pod logs without needing an APM agent.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 2s

; Scrapeable via fastcgi_pass if the nginx sidecar ever routes it.
pm.status_path = /fpm-status
ping.path = /fpm-ping

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
