; A pool of its own for claims (port 9001), next to [www] (port 9000) for every other
; call. A claim with wait_seconds holds its worker while it waits; in a pool of their own,
; waiting claims never leave publishes, acks or the admin API without a worker. nginx
; sends /v1/queues/{queue}/claims here (see docs/self-hosting.md).
;
; ondemand: workers start when claims come and stop after a minute without, so the pool
; costs memory only while workers wait. A waiting worker uses next to no CPU.
;
; The server lets at most MAX_WAITING_CLAIMS claims wait their full time at once on a node
; (default 30); others wait at most a second, so this pool keeps workers coming free for
; claims that find work. Keep pm.max_children above MAX_WAITING_CLAIMS.
[claims]
listen = 9001
pm = ondemand
pm.max_children = 32
pm.process_idle_timeout = 60s
pm.max_requests = 10000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
