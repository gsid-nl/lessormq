; PHP settings for the LessorMQ server image.
; Loaded from /usr/local/etc/php/conf.d/ after the base image php.ini.

; Code in the image is immutable: never stat files on include.
opcache.validate_timestamps = 0
opcache.enable_file_override = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20011

; Compile the whole Symfony prod container once, at FPM master start.
; The wrapper resolves the app root: the deployment serves from a shared volume at
; /var/www/html, not from the image path.
opcache.preload = /usr/local/etc/php/preload.php
opcache.preload_user = www-data

opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; The base image sets 5000M, which lets a single runaway request take down
; the pod. This service handles small JSON payloads only.
memory_limit = 256M

; Stored and compared times are UTC; Kernel::boot() sets the same at runtime.
date.timezone = UTC

expose_php = Off
zend.detect_unicode = 0
