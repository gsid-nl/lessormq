# Releases from a version tag on this repository. gsid's Gitea sets it when a version is
# tagged there (.gitea/workflows/images.yml, publish-github.sh), so one tag releases
# everything:
#
#   0.3.0             the server (ghcr.io/gsid-nl/lessormq:0.3.0, :0.3, :latest, and a
#                     GitHub release with the static linux binaries for amd64 and arm64,
#                     with a config file and systemd units, and their SHA256SUMS) and every client at 0.3.0: PyPI lessormq, npm
#                     lessormq, Packagist lessormq/client, lessormq/messenger and
#                     lessormq/laravel (tags v0.3.0 on gsid-nl/lessormq-php, -messenger
#                     and -laravel), Go (tag v0.3.0 on
#                     gsid-nl/lessormq-go), NuGet LessorMQ and
#                     LessorMQ.Extensions.Hosting, RubyGems lessormq and lessormq-rails, and
#                     Maven Central dev.lessormq:lessormq and lessormq-spring-boot-starter,
#                     and PyPI lessormq-django and lessormq-celery
#   python-0.3.1      only that client, for a fix of its own; likewise typescript-, php-,
#   ...               messenger-, laravel-, go-, dotnet-, ruby-, rails-, django- and
#                     celery-; java- releases
#                     the Java client and the Spring Boot starter together
#
# The version comes from the tag: the Python and TypeScript packages get it written in
# when they are built, and lessormq/messenger requires lessormq/client of the same
# version. Nothing is published unless all of ci.yml passes on the tagged commit: the
# server's tests and the conformance suite through every client. A version with a hyphen
# (0.3.0-rc.1) is a pre-release: no :latest, no :0.3, npm dist-tag next.
#
# Set up once, outside this repository:
#   - PyPI: a trusted publisher for the projects lessormq, lessormq-django and
#     lessormq-celery (gsid-nl/lessormq, release.yml).
#   - npm: trusted publishing for package lessormq (gsid-nl/lessormq, release.yml).
#   - secret SPLIT_TOKEN: a token that may push tags to gsid-nl/lessormq-php,
#     gsid-nl/lessormq-messenger, gsid-nl/lessormq-laravel and gsid-nl/lessormq-go.
#   - Packagist: lessormq/client, lessormq/messenger and lessormq/laravel submitted from
#     those repositories.
#   - NuGet: a trusted publishing policy for gsid-nl/lessormq, release.yml, and the
#     nuget.org profile name in the repository variable NUGET_USER.
#   - RubyGems: a trusted publisher for lessormq and for lessormq-rails (gsid-nl/lessormq,
#     release.yml); until the gems exist, pending ones, with the owning account's id in
#     the repository variable RUBYGEMS_OWNER.
#   - Maven Central: the namespace dev.lessormq verified (a DNS TXT record on lessormq.dev),
#     a Central Portal user token in the secrets CENTRAL_USERNAME and CENTRAL_PASSWORD, and
#     a GPG key (its public half on a keyserver) in GPG_PRIVATE_KEY and GPG_PASSPHRASE.
name: release

on:
  push:
    tags:
      - '[0-9]*'
      - 'python-[0-9]*'
      - 'typescript-[0-9]*'
      - 'php-[0-9]*'
      - 'messenger-[0-9]*'
      - 'go-[0-9]*'
      - 'dotnet-[0-9]*'
      - 'ruby-[0-9]*'
      - 'rails-[0-9]*'
      - 'laravel-[0-9]*'
      - 'java-[0-9]*'
      - 'django-[0-9]*'
      - 'celery-[0-9]*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      splits: ${{ steps.parse.outputs.splits }}
    steps:
      - uses: actions/checkout@v5
      - id: parse
        name: Read the component and version from the tag
        run: |
          set -eu
          tag=$GITHUB_REF_NAME
          case $tag in
            [0-9]*) component=server version=$tag ;;
            *) component=${tag%%-*} version=${tag#*-} ;;
          esac
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$tag: the version must look like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # The clients that live in a repository of their own (PHP, Go).
          case $component in
            server) splits='["php", "messenger", "laravel", "go"]' ;;
            php | messenger | laravel | go) splits="[\"$component\"]" ;;
            *) splits='[]' ;;
          esac
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          {
            echo "component=$component"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "splits=$splits"
          } >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  server:
    needs: [version, ci]
    if: needs.version.outputs.component == 'server'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Image tags
        run: |
          image=ghcr.io/gsid-nl/lessormq
          {
            echo 'list<<EOF'
            echo "$image:$VERSION"
            if [ "$PRERELEASE" = false ]; then
              echo "$image:${VERSION%.*}"
              echo "$image:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.tags.outputs.list }}
      # The binary of the image on its own, for hosts without containers (a systemd
      # service, see docs/self-hosting.md): the same static build, one tarball per
      # architecture with the licence, an example lessormq.conf and the systemd units
      # (server/packaging), and SHA256SUMS over the tarballs.
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Binaries
        working-directory: server
        run: |
          set -eu
          mkdir -p ../dist
          for arch in amd64 arm64; do
            name=lessormq-$VERSION-linux-$arch
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "build/$name/lessormq" ./cmd/lessormq
            cp ../LICENSE "build/$name/"
            cp -R packaging/. "build/$name/"
            tar -C build -czf "../dist/$name.tar.gz" "$name"
          done
          (cd ../dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "LessorMQ $VERSION" "${flags[@]}" dist/*

  python:
    needs: [version, ci]
    if: contains(fromJSON('["server", "python"]'), needs.version.outputs.component)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build, with the version of the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # PEP 440 writes a pre-release 1.2.3-rc.1 as 1.2.3rc1.
          version=$(echo "$VERSION" | sed -E 's/-(a|alpha)\.?/a/; s/-(b|beta)\.?/b/; s/-rc\.?/rc/')
          sed -i -E "s/^__version__ = \".*\"$/__version__ = \"$version\"/" clients/python/src/lessormq/__init__.py
          python -m pip install -q build
          python -m build clients/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist

  # lessormq-django and lessormq-celery. A server tag releases every package at one
  # version, so they then require that lessormq; a django- or celery- tag keeps the
  # requirement they have, since lessormq of their version may not exist.
  #
  # The job runs in the environment pypi, and both projects' trusted publishers name it:
  # PyPI issues a token for one publisher, so with two different ones it is valid for
  # one project only. skip-existing lets a job that failed halfway run again.
  python-frameworks:
    needs: [version, ci]
    if: contains(fromJSON('["server", "django", "celery"]'), needs.version.outputs.component)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build, with the version of the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMPONENT: ${{ needs.version.outputs.component }}
        run: |
          set -eu
          # PEP 440 writes a pre-release 1.2.3-rc.1 as 1.2.3rc1.
          version=$(echo "$VERSION" | sed -E 's/-(a|alpha)\.?/a/; s/-(b|beta)\.?/b/; s/-rc\.?/rc/')
          python -m pip install -q build
          for d in django celery; do
            [ "$COMPONENT" = server ] || [ "$COMPONENT" = "$d" ] || continue
            sed -i -E "s/^__version__ = \".*\"$/__version__ = \"$version\"/" clients/$d/src/lessormq_$d/__init__.py
            if [ "$COMPONENT" = server ]; then
              sed -i -E "s/\"lessormq>=[^\"]*\"/\"lessormq>=$version\"/" clients/$d/pyproject.toml
            fi
            python -m build clients/$d --outdir dist
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  typescript:
    needs: [version, ci]
    if: contains(fromJSON('["server", "typescript"]'), needs.version.outputs.component)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g 'npm@^11.5.1'
      - run: npm ci
      - name: Publish, with the version of the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          # The User-Agent's version; a test checks it against package.json.
          sed -i -E "s/^export const VERSION = \".*\";$/export const VERSION = \"$VERSION\";/" src/version.ts
          grep -q "^export const VERSION = \"$VERSION\";$" src/version.ts
          tag=latest
          [ "$PRERELEASE" = true ] && tag=next
          npm publish --provenance --access public --tag "$tag"

  dotnet:
    needs: [version, ci]
    if: contains(fromJSON('["server", "dotnet"]'), needs.version.outputs.component)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # -p:Version overrides the 0.1.0 of Directory.Build.props; 1.2.3-rc.1 is a
      # NuGet pre-release as it is.
      - name: Pack, with the version of the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: dotnet pack clients/dotnet/LessorMQ.slnx -c Release -p:Version="$VERSION" -o clients/dotnet/artifacts
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish
        run: |
          dotnet nuget push 'clients/dotnet/artifacts/*.nupkg' --api-key '${{ steps.nuget.outputs.NUGET_API_KEY }}' \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  # lessormq-rails requires lessormq of its own version, so lessormq goes first; a
  # rails- tag on its own needs that lessormq published already, as messenger does.
  ruby:
    needs: [version, ci]
    if: contains(fromJSON('["server", "ruby", "rails"]'), needs.version.outputs.component)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # The action has no major-version tag.
      - uses: rubygems/configure-rubygems-credentials@v2.2.0
        with:
          owner: ${{ vars.RUBYGEMS_OWNER }}
      - name: Build and push, with the version of the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMPONENT: ${{ needs.version.outputs.component }}
        run: |
          set -eu
          # RubyGems writes a pre-release 1.2.3-rc.1 as 1.2.3.rc.1.
          version=${VERSION/-/.}
          sed -i -E "s/VERSION = \".*\"/VERSION = \"$version\"/" \
            clients/ruby/lib/lessormq/version.rb clients/rails/lib/lessormq/rails/version.rb
          if [ "$COMPONENT" != rails ]; then
            (cd clients/ruby && gem build lessormq.gemspec && gem push "lessormq-$version.gem")
          fi
          if [ "$COMPONENT" != ruby ]; then
            (cd clients/rails && gem build lessormq-rails.gemspec && gem push "lessormq-rails-$version.gem")
          fi

  # The starter requires the client of its own version, so the client goes first. The
  # release profile adds sources, javadoc, signatures and the upload to Central.
  java:
    needs: [version, ci]
    if: contains(fromJSON('["server", "java"]'), needs.version.outputs.component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy, with the version of the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          for d in clients/java clients/spring-boot; do
            mvn -B -ntp -f "$d/pom.xml" org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
              -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          done
          mvn -B -ntp -f clients/java/pom.xml -P release deploy
          mvn -B -ntp -f clients/spring-boot/pom.xml -P release deploy

  # PHP and Go read a package from the root of its own repository, so these clients are
  # published as a tag on a repository that holds only that client. publish-github.sh
  # keeps their main branches current; this only adds the tag, on a commit with exactly
  # the tagged tree, and never moves main.
  split:
    needs: [version, ci]
    if: needs.version.outputs.splits != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.version.outputs.splits) }}
    env:
      COMPONENT: ${{ matrix.component }}
      VERSION: ${{ needs.version.outputs.version }}
      SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag the client's own repository
        run: |
          set -eu
          case $COMPONENT in
            php) repo=lessormq-php dir=clients/php ;;
            messenger) repo=lessormq-messenger dir=clients/symfony-messenger ;;
            laravel) repo=lessormq-laravel dir=clients/laravel ;;
            go) repo=lessormq-go dir=clients/go ;;
          esac
          if [ -z "$SPLIT_TOKEN" ]; then
            echo "::error::secret SPLIT_TOKEN is not set"
            exit 1
          fi
          tag=v$VERSION
          git clone -q "https://x-access-token:$SPLIT_TOKEN@github.com/gsid-nl/$repo.git" split
          if git -C split rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$repo already has $tag"
            exit 1
          fi
          find split -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git archive "HEAD:$dir" | tar -x -C split
          # lessormq/messenger and lessormq/laravel require lessormq/client of their own
          # version.
          if [ "$COMPONENT" = messenger ] || [ "$COMPONENT" = laravel ]; then
            sed -i -E "/\"require\": \\{/,/\\}/ s#(\"lessormq/client\": )\"[^\"]*\"#\\1\"^$VERSION\"#" split/composer.json
            grep -q "\"lessormq/client\": \"^$VERSION\"" split/composer.json
          fi
          git -C split add -A
          # When main already holds this tree, the tag goes on main itself.
          if ! git -C split diff --cached --quiet; then
            git -C split -c user.name="$(git log -1 --format=%an)" \
              -c user.email="$(git log -1 --format=%ae)" \
              commit -q -m "$COMPONENT $VERSION"
          fi
          git -C split tag "$tag"
          git -C split push -q origin "refs/tags/$tag"
          echo "$repo: $tag on $(git -C split rev-parse --short HEAD)"
