# Releases from a version tag on this repository. gsid's Gitea sets it when a version is
# tagged there (.gitea/workflows/images.yml, publish-github.sh), so one tag releases
# everything:
#
#   0.3.0             the server (ghcr.io/gsid-nl/lessormq:0.3.0, :0.3, :latest, and a
#                     GitHub release) and every client at 0.3.0: PyPI lessormq, npm
#                     lessormq, Packagist lessormq/client and lessormq/messenger (tags
#                     v0.3.0 on gsid-nl/lessormq-php and -messenger), and Go (tag v0.3.0 on
#                     gsid-nl/lessormq-go)
#   python-0.3.1      only that client, for a fix of its own; likewise typescript-, php-,
#   ...               messenger- and go-
#
# The version comes from the tag: the Python and TypeScript packages get it written in
# when they are built, and lessormq/messenger requires lessormq/client of the same
# version. Nothing is published unless all of ci.yml passes on the tagged commit: the
# server's tests and the conformance suite through every client. A version with a hyphen
# (0.3.0-rc.1) is a pre-release: no :latest, no :0.3, npm dist-tag next.
#
# Set up once, outside this repository:
#   - PyPI: a trusted publisher for project lessormq (gsid-nl/lessormq, release.yml).
#   - npm: trusted publishing for package lessormq (gsid-nl/lessormq, release.yml).
#   - secret SPLIT_TOKEN: a token that may push tags to gsid-nl/lessormq-php,
#     gsid-nl/lessormq-messenger and gsid-nl/lessormq-go.
#   - Packagist: lessormq/client and lessormq/messenger submitted from those repositories.
name: release

on:
  push:
    tags:
      - '[0-9]*'
      - 'python-[0-9]*'
      - 'typescript-[0-9]*'
      - 'php-[0-9]*'
      - 'messenger-[0-9]*'
      - 'go-[0-9]*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      splits: ${{ steps.parse.outputs.splits }}
    steps:
      - uses: actions/checkout@v5
      - id: parse
        name: Read the component and version from the tag
        run: |
          set -eu
          tag=$GITHUB_REF_NAME
          case $tag in
            [0-9]*) component=server version=$tag ;;
            *) component=${tag%%-*} version=${tag#*-} ;;
          esac
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$tag: the version must look like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # The clients that live in a repository of their own (PHP, Go).
          case $component in
            server) splits='["php", "messenger", "go"]' ;;
            php | messenger | go) splits="[\"$component\"]" ;;
            *) splits='[]' ;;
          esac
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          {
            echo "component=$component"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "splits=$splits"
          } >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  server:
    needs: [version, ci]
    if: needs.version.outputs.component == 'server'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Image tags
        run: |
          image=ghcr.io/gsid-nl/lessormq
          {
            echo 'list<<EOF'
            echo "$image:$VERSION"
            if [ "$PRERELEASE" = false ]; then
              echo "$image:${VERSION%.*}"
              echo "$image:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.tags.outputs.list }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "LessorMQ $VERSION" "${flags[@]}"

  python:
    needs: [version, ci]
    if: contains(fromJSON('["server", "python"]'), needs.version.outputs.component)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build, with the version of the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # PEP 440 writes a pre-release 1.2.3-rc.1 as 1.2.3rc1.
          version=$(echo "$VERSION" | sed -E 's/-(a|alpha)\.?/a/; s/-(b|beta)\.?/b/; s/-rc\.?/rc/')
          sed -i -E "s/^__version__ = \".*\"$/__version__ = \"$version\"/" clients/python/src/lessormq/__init__.py
          python -m pip install -q build
          python -m build clients/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist

  typescript:
    needs: [version, ci]
    if: contains(fromJSON('["server", "typescript"]'), needs.version.outputs.component)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g 'npm@^11.5.1'
      - run: npm ci
      - name: Publish, with the version of the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          tag=latest
          [ "$PRERELEASE" = true ] && tag=next
          npm publish --provenance --access public --tag "$tag"

  # PHP and Go read a package from the root of its own repository, so these clients are
  # published as a tag on a repository that holds only that client. publish-github.sh
  # keeps their main branches current; this only adds the tag, on a commit with exactly
  # the tagged tree, and never moves main.
  split:
    needs: [version, ci]
    if: needs.version.outputs.splits != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.version.outputs.splits) }}
    env:
      COMPONENT: ${{ matrix.component }}
      VERSION: ${{ needs.version.outputs.version }}
      SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag the client's own repository
        run: |
          set -eu
          case $COMPONENT in
            php) repo=lessormq-php dir=clients/php ;;
            messenger) repo=lessormq-messenger dir=clients/symfony-messenger ;;
            go) repo=lessormq-go dir=clients/go ;;
          esac
          if [ -z "$SPLIT_TOKEN" ]; then
            echo "::error::secret SPLIT_TOKEN is not set"
            exit 1
          fi
          tag=v$VERSION
          git clone -q "https://x-access-token:$SPLIT_TOKEN@github.com/gsid-nl/$repo.git" split
          if git -C split rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$repo already has $tag"
            exit 1
          fi
          find split -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git archive "HEAD:$dir" | tar -x -C split
          # lessormq/messenger requires lessormq/client of its own version.
          if [ "$COMPONENT" = messenger ]; then
            sed -i -E "/\"require\": \\{/,/\\}/ s#(\"lessormq/client\": )\"[^\"]*\"#\\1\"^$VERSION\"#" split/composer.json
            grep -q "\"lessormq/client\": \"^$VERSION\"" split/composer.json
          fi
          git -C split add -A
          # When main already holds this tree, the tag goes on main itself.
          if ! git -C split diff --cached --quiet; then
            git -C split -c user.name="$(git log -1 --format=%an)" \
              -c user.email="$(git log -1 --format=%ae)" \
              commit -q -m "$COMPONENT $VERSION"
          fi
          git -C split tag "$tag"
          git -C split push -q origin "refs/tags/$tag"
          echo "$repo: $tag on $(git -C split rev-parse --short HEAD)"
