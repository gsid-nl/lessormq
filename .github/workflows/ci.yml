# Tests for the server (Go, server/), every client, the documentation and the examples, on every push
# and pull request. release.yml runs all of it again on a version tag before it publishes
# anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go
        run: |
          cd server
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      # The documentation build and the conformance runner are PHP (repository tools).
      - run: composer install --no-interaction --no-progress
      - run: php docs/tools/build.php --check

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          # The client and the examples use only the standard library: nothing to cache.
          cache: false
      - run: composer install --no-interaction --no-progress
      - name: The scenarios over plain HTTP
        run: conformance/run.sh
      - name: Through the PHP client
        run: |
          (cd clients/php && composer install --no-interaction --no-progress)
          LESSORMQ_ADAPTER=clients/php/tests/Conformance/adapter.php conformance/run.sh
      - name: Through the Python client
        run: |
          python -m venv clients/python/.venv
          clients/python/.venv/bin/pip install -q -e 'clients/python[dev]'
          LESSORMQ_ADAPTER_CMD="clients/python/.venv/bin/python clients/python/tests/conformance_adapter.py" conformance/run.sh
      - name: Through the TypeScript client
        run: |
          (cd clients/typescript && npm ci)
          LESSORMQ_ADAPTER_CMD="node clients/typescript/test/conformance-adapter.ts" conformance/run.sh
      - name: Through the Go client
        run: LESSORMQ_ADAPTER_CMD="cd clients/go && go run ./internal/conformance" conformance/run.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Through the .NET client
        run: |
          dotnet build -c Release clients/dotnet/conformance/LessorMQ.Conformance
          LESSORMQ_ADAPTER_CMD="dotnet clients/dotnet/conformance/LessorMQ.Conformance/bin/Release/net10.0/LessorMQ.Conformance.dll" conformance/run.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: clients/java/pom.xml
      # test-compile also copies the client's dependencies to target/dependency.
      - name: Through the Java client
        run: |
          mvn -B -ntp -q -f clients/java/pom.xml test-compile
          LESSORMQ_ADAPTER_CMD="java -cp 'clients/java/target/classes:clients/java/target/test-classes:clients/java/target/dependency/*' dev.lessormq.conformance.ConformanceAdapter" conformance/run.sh
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      # The adapter needs nothing but Ruby.
      - name: Through the Ruby client
        run: LESSORMQ_ADAPTER_CMD="ruby clients/ruby/test/conformance_adapter.rb" conformance/run.sh

  # The protocol scenarios over plain HTTP with the server on each of the other
  # databases; MariaDB is the conformance job above.
  databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, postgresql, sqlite]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: conformance/run.sh
        env:
          LESSORMQ_DATABASE: ${{ matrix.database }}

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          # The client and the examples use only the standard library: nothing to cache.
          cache: false
      - name: PHP
        run: cd clients/php && composer install --no-interaction --no-progress && vendor/bin/phpunit
      - name: Symfony Messenger
        run: cd clients/symfony-messenger && composer install --no-interaction --no-progress && vendor/bin/phpunit
      - name: Python
        run: |
          cd clients/python
          pip install -q -e '.[dev]'
          pytest -q
          mypy
      - name: TypeScript
        run: |
          cd clients/typescript
          npm ci
          npm run typecheck
          npm test
          npm run generate && git diff --exit-code src/openapi.ts
      - name: Go
        run: |
          cd clients/go
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      # dotnet test runs from inside clients/dotnet, where global.json picks the test
      # platform.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: .NET
        run: |
          cd clients/dotnet
          dotnet test -c Release
          dotnet format LessorMQ.slnx --verify-no-changes --no-restore

  # The Java client, and its Spring Boot starter on every Boot it says it works with.
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            clients/java/pom.xml
            clients/spring-boot/pom.xml
      - name: Java
        run: mvn -B -ntp -f clients/java/pom.xml install
      - name: Spring Boot
        run: |
          for boot in 3.5.16 4.0.10 4.1.3 4.2.0; do
            mvn -B -ntp -f clients/spring-boot/pom.xml verify -Dspring-boot.version=$boot
          done

  # The Ruby client and its Rails integration, on every Ruby and Rails still supported.
  ruby:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ruby: '3.3', rails: '7.2'}
          - {ruby: '3.3', rails: '8.0'}
          - {ruby: '3.4', rails: '8.1'}
          - {ruby: '4.0', rails: '8.1'}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Ruby
        run: cd clients/ruby && bundle install && bundle exec rake test
      - name: Rails
        env:
          RAILS_VERSION: ${{ matrix.rails }}
        run: cd clients/rails && bundle install && bundle exec rake test

  # The Laravel driver on every Laravel it supports.
  laravel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.2', testbench: '^10.0'}  # Laravel 12
          - {php: '8.4', testbench: '^11.0'}  # Laravel 13
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl
          tools: composer
      - name: Laravel
        working-directory: clients/laravel
        run: |
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --no-interaction --no-progress
          vendor/bin/phpunit

  # The framework integrations end to end, against a server of this commit
  # (conformance/with-server.sh): a job dispatched through the framework is run by its
  # worker, retried by the queue, and dead-lettered.
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Rails
        run: |
          cd clients/rails
          bundle install
          ../../conformance/with-server.sh bundle exec rake e2e
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl
          tools: composer
      - name: Laravel
        run: |
          cd clients/laravel
          composer install --no-interaction --no-progress
          ../../conformance/with-server.sh vendor/bin/phpunit --group e2e
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            clients/java/pom.xml
            clients/spring-boot/pom.xml
      - name: Spring Boot
        run: |
          mvn -B -ntp -q -f clients/java/pom.xml install -DskipTests
          cd clients/spring-boot
          ../../conformance/with-server.sh mvn -B -ntp test -Dtest=EndToEndTest
      # Django 6 needs Python 3.12. The unit tests run here too, with the end-to-end ones.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Django and Celery
        run: |
          for d in django celery; do
            (
              cd clients/$d
              python -m venv .venv
              .venv/bin/pip install -q -e ../python -e '.[dev]'
              .venv/bin/mypy
              ../../conformance/with-server.sh .venv/bin/pytest -q
            )
          done

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          # The client and the examples use only the standard library: nothing to cache.
          cache: false
      - run: composer install --no-interaction --no-progress
      - run: examples/test.sh
