# nginx in front of the two application nodes, taking turns, as a load balancer or a
# Kubernetes service does. max_fails=0: a slow node is not taken out of turn.
upstream lessormq {
    server app1:8080 max_fails=0;
    server app2:8080 max_fails=0;
    keepalive 64;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16m;

    location / {
        proxy_pass http://lessormq;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # A claim may wait up to 20 seconds for a message.
        proxy_read_timeout 30s;
    }
}
