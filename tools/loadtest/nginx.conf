# nginx in front of the two application nodes, as gsid's pods have it (one nginx per
# node there; one for both here, taking turns). Claims go to the claims pool of a node
# (port 9001), every other call to its www pool (9000). max_fails=0: a slow node is not
# taken out of turn, as a pod's own nginx would not. No keepalive to FPM, as in
# production: an FPM worker kept on an idle connection serves nobody else.
upstream lessormq {
    server app1:9000 max_fails=0;
    server app2:9000 max_fails=0;
}

upstream lessormq_claims {
    server app1:9001 max_fails=0;
    server app2:9001 max_fails=0;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16m;

    location ~ ^/v1/queues/[^/]+/claims$ {
        include fastcgi_params;
        fastcgi_pass lessormq_claims;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        # A claim may wait up to 20 seconds for a message.
        fastcgi_read_timeout 30s;
    }

    location / {
        include fastcgi_params;
        fastcgi_pass lessormq;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_read_timeout 30s;
    }
}
