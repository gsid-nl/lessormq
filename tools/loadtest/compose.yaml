# A LessorMQ installation shaped like gsid's on hetzner, to load locally: two application
# nodes (the server image, 1 CPU each) behind nginx, with MariaDB and Redis. run-local.sh
# starts it, loads it and removes it.
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: lessormq
      MARIADB_DATABASE: lessormq
    command: ["--max-connections=500"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine

  app1: &app
    build:
      context: ../../server
      dockerfile: Dockerfile
    image: lessormq-loadtest:server
    environment:
      DATABASE_QUEUE_URL: mysql://root:lessormq@db:3306/lessormq?serverVersion=mariadb-10.11.0&charset=utf8mb4
      REDIS_URL: redis://redis:6379
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/lessormq", "healthcheck"]
      interval: 2s
      retries: 60

  app2: *app

  web:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${LOADTEST_PORT:-18690}:8080"
    depends_on: [app1, app2]
