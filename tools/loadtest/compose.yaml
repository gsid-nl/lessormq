# A LessorMQ installation shaped like gsid's on hetzner, to load locally: two application
# nodes (the production image: PHP-FPM with 16 workers for most calls and up to 32 for
# claims, 1 CPU and 2.5 GiB each) behind nginx, with MariaDB and Redis. run-local.sh starts
# it, loads it and removes it.
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: lessormq
      MARIADB_DATABASE: lessormq
    command: ["--max-connections=500"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine

  app1: &app
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: server
      pull: true
    image: lessormq-loadtest:server
    environment: &env
      APP_ENV: prod
      APP_SECRET: loadtest
      DATABASE_QUEUE_URL: mysql://root:lessormq@db:3306/lessormq?serverVersion=mariadb-10.11.0&charset=utf8mb4
      REDIS_URL: redis://redis:6379
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2560m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  app2: *app

  web:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${LOADTEST_PORT:-18690}:8080"
    depends_on: [app1, app2]
