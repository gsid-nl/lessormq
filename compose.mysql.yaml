# With compose.yaml: the server on MySQL 8 instead of MariaDB.
#   docker compose -f compose.yaml -f compose.mysql.yaml up -d --wait
services:
  db:
    image: mysql:8.4
    environment: !override
      MYSQL_ROOT_PASSWORD: lessormq
      MYSQL_DATABASE: lessormq
    healthcheck: !override
      # Over TCP: the server MySQL runs while it sets up the database takes no network.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plessormq"]
      interval: 2s
      retries: 60

  app:
    environment:
      DATABASE_QUEUE_URL: mysql://root:lessormq@db:3306/lessormq?serverVersion=8.4.0&charset=utf8mb4
