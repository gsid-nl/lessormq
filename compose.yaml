# LessorMQ on your machine: the server from server/ with MariaDB and Redis, on
# http://127.0.0.1:18080 (LESSORMQ_PORT to change it).
#
#   docker compose up
#   docker compose exec app lessormq operator-key:create
#
# Another database: add its file, e.g. docker compose -f compose.yaml -f
# compose.postgresql.yaml up (or compose.mysql.yaml, compose.sqlite.yaml). Redis is here
# to test what several nodes share; one node runs without it.
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: lessormq
      MARIADB_DATABASE: lessormq
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine

  app:
    build:
      context: server
      dockerfile: Dockerfile
    image: lessormq-dev
    environment:
      DATABASE_QUEUE_URL: mysql://root:lessormq@db:3306/lessormq?serverVersion=mariadb-10.11.0&charset=utf8mb4
      REDIS_URL: redis://redis:6379
      LEASE_SWEEP_SECONDS: ${LEASE_SWEEP_SECONDS:-60}
    ports:
      - "127.0.0.1:${LESSORMQ_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/lessormq", "healthcheck"]
      interval: 2s
      retries: 60
