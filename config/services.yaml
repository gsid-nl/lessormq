parameters:
    # How often, at most, a queue's expired leases are ended.
    lessormq.lease_sweep_seconds_default: 60
    lessormq.lease_sweep_seconds: '%env(int:default:lessormq.lease_sweep_seconds_default:LEASE_SWEEP_SECONDS)%'
    # At most this many claims wait at once on a node (0: no limit); see docker/claims.conf.
    lessormq.max_waiting_claims_default: 30
    lessormq.max_waiting_claims: '%env(int:default:lessormq.max_waiting_claims_default:MAX_WAITING_CLAIMS)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            int $leaseSweepSeconds: '%lessormq.lease_sweep_seconds%'
            int $maxWaitingClaims: '%lessormq.max_waiting_claims%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    # The SQL that differs per database, for the database DATABASE_QUEUE_URL names.
    App\Database\Dialect:
        factory: ['App\Database\Dialect', 'for']
        arguments: ['@doctrine.dbal.default_connection']

    Predis\Client:
        arguments:
            # Harden against transient CoreDNS / connect blips (EAI_AGAIN).
            # Connection params are appended to the URI as a query string so
            # Predis applies them: short connect/RW timeouts so a blip fails
            # fast, and persistent connections so the DNS lookup + TCP
            # handshake is reused across requests instead of run every call.
            - '%env(REDIS_URL)%?timeout=2&read_write_timeout=2&persistent=1'
