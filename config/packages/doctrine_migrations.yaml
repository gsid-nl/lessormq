doctrine_migrations:
    # One series per database; only the series of the database in DATABASE_QUEUE_URL runs
    # (App\Doctrine\PlatformMigrationFinder). The namespaces are not autoloaded.
    migrations_paths:
        # MariaDB: every migration since the beginning, in migrations/ itself.
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
        'LessorMQ\Migrations\MySQL': '%kernel.project_dir%/migrations/mysql'
        'LessorMQ\Migrations\PostgreSQL': '%kernel.project_dir%/migrations/postgresql'
        'LessorMQ\Migrations\SQLite': '%kernel.project_dir%/migrations/sqlite'
    services:
        'Doctrine\Migrations\Finder\MigrationFinder': 'App\Doctrine\PlatformMigrationFinder'
    enable_profiler: false
