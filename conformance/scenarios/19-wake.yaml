name: A waiting claim takes new work within moments of its publish, and a delayed message as soon as it is due
steps:
  - claim: {wait_seconds: 8, publish_after: {seconds: 1, body: {n: 1}}}
    expect: {status: 200, body.message.body: {n: 1}, elapsed: {between: [0.9, 1.7]}}
  - publish: {body: {n: 2}, delay_seconds: 2}
  - claim: {wait_seconds: 8}
    expect: {status: 200, body.message.body: {n: 2}, elapsed: {between: [0.9, 2.3]}}
  - claim: {wait_seconds: 1}
    expect: {status: 204}
